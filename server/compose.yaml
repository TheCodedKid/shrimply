services:
  server:
    image: ghcr.io/soirihiroka/shrimply-server:${SHRIMPLY_SERVER_TAG:-prerelease-cuda${CUDA_VERSION:-12.6}}
    gpus: all
    network_mode: host
    volumes:
      - ./.docker/venv:/app/.venv
      - ./.docker/cache:/root/.cache/uv
      - ./.docker/huggingface:/root/.cache/huggingface
      - ./.docker/pneuma/models:/app/models
      - ./.docker/python:/root/.local/share/uv/python
