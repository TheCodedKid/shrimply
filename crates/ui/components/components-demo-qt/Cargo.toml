[package]
name = "shrimply-components-demo-qt"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shrimply-qt-components-demo"
path = "src/main.rs"

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib = { workspace = true, features = ["qt_full"] }
shrimply-profiling = { workspace = true }
shrimply-components-demo-core = { workspace = true }
shrimply-keyframe-graph-skia = { workspace = true }
shrimply-math-core = { workspace = true }
shrimply-components-qt = { workspace = true }
shrimply-application-qt = { workspace = true }
shrimply-process-reporting = { workspace = true }

[build-dependencies]
cxx-qt-build = { workspace = true, features = ["link_qt_object_files"] }
