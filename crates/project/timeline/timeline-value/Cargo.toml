[package]
name = "shrimply-timeline-value"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = { workspace = true, features = ["serde"] }
num-traits.workspace = true
serde = { workspace = true, features = ["derive"] }
shrimply-math-interpolation = { workspace = true }
shrimply-math-color = { workspace = true }
shrimply-render-core = { workspace = true }
shrimply-math-core = { workspace = true }
shrimply-math-geometry = { workspace = true }
shrimply-transform-3d = { workspace = true }
unicode-segmentation.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
